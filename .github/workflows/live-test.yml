name: Live test

# Runs every example against the WikiPathways SPARQL endpoint once a week and
# checks the expected number of results (snorql:expect). A failing run means a
# query broke, an endpoint it federates with is down, or the data changed.

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wikipathways/Snorql-UI
          ref: v1.4.0
          path: .snorql-tools
          sparse-checkout: tools/examples
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r .snorql-tools/tools/examples/requirements.txt
      # Federated endpoints (Wikidata above all) fail now and then with an HTTP 500
      # or a timeout. Examples that fail are run once more after a pause; the run
      # only fails if they fail again.
      - name: Run the examples
        shell: bash
        run: |
          tool=.snorql-tools/tools/examples/snorql_examples.py
          python "$tool" live --timeout 150 | tee live.txt && exit 0
          failed=$(grep '| FAIL' live.txt | cut -d'|' -f2 | tr -d ' ' | tr '\n' ' ' || true)
          [ -n "${failed// /}" ] || exit 1
          echo "Retrying in 2 minutes: $failed"
          sleep 120
          echo "Retry of the failed examples:" >> "$GITHUB_STEP_SUMMARY"
          python "$tool" live --timeout 150 --only $failed
